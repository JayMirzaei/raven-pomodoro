name: Release

# Builds the Windows, macOS and Linux downloads. Pushing a version tag (for
# example v0.1.0, matching apps/desktop/package.json) also publishes them as a
# GitHub Release. Running it by hand (Actions, Release, Run workflow) builds
# them as workflow artifacts only.
#
# No secrets are needed: the builds are offline (no sync) and unsigned, and the
# release is created with the GITHUB_TOKEN that Actions provides. To build
# with sync instead, set the repository *variables* (not secrets; the anon key
# is public by design) SUPABASE_URL and SUPABASE_ANON_KEY.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: apps/desktop/release/*.exe
          - os: macos-latest
            script: build:mac
            files: apps/desktop/release/*.dmg
          - os: ubuntu-latest
            script: build:linux
            files: apps/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Empty unless the repository variables are set: then this is an offline build.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # No code-signing identity: do not look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}." >&2
            exit 1
          fi

      - name: Install
        run: npm install

      - name: Build the installer
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: raven-pomodoro-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Raven Pomodoro ${{ github.ref_name }}
          body: |
            Downloads for Windows (.exe installer), macOS (universal .dmg) and Linux (.AppImage).
            These builds work offline: the timer and counts stay on your computer, with no sign-in.
            They are not code-signed, so Windows and macOS warn on first launch; the README explains
            how to open them.
          files: downloads/*
          fail_on_unmatched_files: true
