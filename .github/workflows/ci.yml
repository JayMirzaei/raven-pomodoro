name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only the bundles are built here, so the Electron binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (timer, counts, sync, row level security)
        run: npm test

      - name: Build the desktop bundles (offline, the default)
        run: npm run build --workspace=apps/desktop

      - name: Build the desktop bundles with sync
        run: npm run build --workspace=apps/desktop
        env:
          # Placeholders: the build only needs well-formed values, never a real project.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
