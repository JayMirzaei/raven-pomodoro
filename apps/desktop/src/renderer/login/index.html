<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sign in to Raven</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, sans-serif;
        background: #14151a;
        color: #eee;
        padding: 20px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 img {
        width: 28px;
        height: 28px;
        image-rendering: pixelated;
      }
      p {
        font-size: 12px;
        color: #9a9aa5;
        margin: 0 0 14px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 10px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1e1f26;
        color: #eee;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: none;
        background: #9a9aa2;
        color: #14151a;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover:not(:disabled) {
        background: #d4d4d8;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        color: #ff6b6b;
        font-size: 12px;
        min-height: 16px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1><img src="../../assets/icons/app-icon.png" alt="" /> Sign in to Raven</h1>
    <p>New here? Just enter an email and a password you'll remember — an account is created automatically.</p>

    <input id="email" type="email" placeholder="you@example.com" autofocus />
    <input id="password" type="password" placeholder="password" />
    <button id="continue-btn">Continue</button>

    <div id="error"></div>

    <script type="module" src="./login.ts"></script>
  </body>
</html>
